[ req ]
authorityKeyIdentifier = keyid,issuer:always # extfile
default_bits       = 2048
default_md         = sha256
distinguished_name = req_distinguished_name
req_extensions     = req_ext
prompt = no
[ req_distinguished_name ]
countryName                 = AU
stateOrProvinceName         = Some-State
organizationName           = Internet Widgits Pty Ltd
commonName                 = localhost
[ req_ext ]
basicConstraints = CA:FALSE # extfile
nsCertType = server # extfile
subjectKeyIdentifier = hash # extfile
keyUsage = critical, digitalSignature, keyEncipherment # extfile
extendedKeyUsage = serverAuth # extfile
subjectAltName = @alt_names # extfile
[alt_names] # extfile
IP.1    = 127.0.0.1 # extfile
IP.2    = ::1 # extfile
DNS.1   = localhost # extfile
DNS.2   = *.local # extfile
